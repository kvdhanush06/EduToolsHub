name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-test-secret-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost,edutoolshub.onrender.com,edutoolshub.allkvd.dev
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test --verbosity=1
      - name: pip-audit
        run: python -m pip_audit --progress spinner
